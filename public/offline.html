<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Offline - Company AI Agent</title>
    <meta name="theme-color" content="#0d6efd" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <script>
        (function() {
            const savedTheme = localStorage.getItem('company_ai_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --muted-text: #64748b;
        }

        [data-bs-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --card-bg: #1e293b;
            --border-color: #334155;
            --primary: #3b82f6;
            --muted-text: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .offline-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icon-container {
            width: 88px;
            height: 88px;
            margin-bottom: 24px;
            position: relative;
        }

        .icon-container img {
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }

        .offline-badge {
            position: absolute;
            bottom: -6px;
            right: -6px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid var(--card-bg);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--muted-text);
            margin-bottom: 28px;
        }

        .btn-retry {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-retry:hover {
            opacity: 0.9;
        }

        .btn-retry:active {
            transform: scale(0.98);
        }

        .status-pill {
            margin-top: 24px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted-text);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
        }

        .status-dot.online {
            background-color: #22c55e;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-container">
            <img src="/icons/icon-192x192.png" alt="Company AI Agent Icon">
            <div class="offline-badge" title="Offline">⚡</div>
        </div>

        <h1>You're Currently Offline</h1>
        <p>It looks like you've lost your network connection. Please check your internet or Wi-Fi and retry.</p>

        <button class="btn-retry" onclick="checkAndReload()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
            Retry Connection
        </button>

        <div class="status-pill">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">No connection detected</span>
        </div>
    </div>

    <script>
        function updateOnlineStatus() {
            const isOnline = navigator.onLine;
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (isOnline) {
                dot.classList.add('online');
                text.textContent = 'Connection restored! Reloading...';
                setTimeout(() => window.location.reload(), 800);
            } else {
                dot.classList.remove('online');
                text.textContent = 'No connection detected';
            }
        }

        function checkAndReload() {
            if (navigator.onLine) {
                window.location.reload();
            } else {
                const text = document.getElementById('statusText');
                text.textContent = 'Still offline. Please check your network.';
                setTimeout(() => {
                    text.textContent = 'No connection detected';
                }, 2500);
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
    </script>
</body>
</html>
